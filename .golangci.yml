version: "2"
linters:
  default: all
  disable:
    - canonicalheader
    - depguard
    - dupl
    - exhaustruct
    - exhaustruct_v5
    - gocyclo
    - lll
    - maintidx
    - nlreturn
    - noinlineerr
    - revive
    - varnamelen
    - wsl
    - wsl_v5
    - gomodguard
  exclusions:
    rules:
      # exhaustruct flags idiomatic zero-value literals such as
      # slog.HandlerOptions{Level: ...}, http.Server and tls.ConnectionState.
      # Listing it under `disable` is not always honoured (CI still reported
      # exhaustruct_v5 with the same binary version and config), so exclude it
      # at report time as well.
      - path: ".*"
        linters:
          - exhaustruct
          - exhaustruct_v5
      - path: "_test\\.go"
        linters:
          - funlen
          - maintidx
          - err113
          - gochecknoglobals
          - goconst
  settings:
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - github.com/a-h/templ.Component
        - go-htmx-template/internal/db.Database
    tagliatelle:
      case:
        rules:
          json: snake
    wrapcheck:
      ignore-package-globs:
        - go-htmx-template/internal/*
