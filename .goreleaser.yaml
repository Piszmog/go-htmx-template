version: 2

dist: goreleaser-dist

before:
  hooks:
    - go mod download
    - just VERSION={{ .Tag }} MINIFY=1 generate

builds:
  - main: ./cmd/server
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X go-htmx-template/internal/version.Value={{ .Tag }}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: ['tar.gz']
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ['zip']

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Re-running a release workflow must update the existing release, not fail on
  # already-uploaded assets.
  replace_existing_artifacts: true
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
